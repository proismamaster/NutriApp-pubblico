name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=USDA_API_KEY=${{ secrets.USDA_API_KEY }}

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NutriApp-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nutriapp-windows
          path: NutriApp-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # build.gradle targets JDK 17 (sourceCompatibility/targetCompatibility/jvmTarget), matching it here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # compileSdk/targetSdk = 36 in android/app/build.gradle: make sure that platform + matching
      # build-tools are installed, same fix BaseFlow's CI needed for its Capacitor Android build.
      - name: Install Android SDK platform matching the project
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --dart-define=USDA_API_KEY=${{ secrets.USDA_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: nutriapp-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
